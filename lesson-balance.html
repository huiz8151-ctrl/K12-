<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysicsLab Pro - 动手实验</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .shadow-tactile {
            box-shadow: 0 4px 0 0 rgba(0,0,0,0.05), 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .shadow-tactile:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 0 rgba(0,0,0,0.05), 0 5px 10px -3px rgba(0,0,0,0.1);
        }
        .digital-display {
            background: #191c1e;
            color: #78fc9c;
            font-family: 'Space Grotesk', monospace;
            border: 2px solid #404751;
        }
        .stage-grid {
            background-size: 40px 40px;
            background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#d1e4ff",
                        "tertiary": "#00632e",
                        "tertiary-container": "#007f3c",
                        "on-secondary-fixed": "#3a0b00",
                        "on-primary-fixed": "#001d36",
                        "inverse-surface": "#2d3133",
                        "primary-container": "#0071bc",
                        "on-surface": "#191c1e",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#5adf82",
                        "outline": "#717882",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-variant": "#e0e3e5",
                        "surface-container-highest": "#e0e3e5",
                        "surface": "#f7f9fb",
                        "on-tertiary-fixed-variant": "#005225",
                        "inverse-on-surface": "#eff1f3",
                        "surface-container-high": "#e6e8ea",
                        "error-container": "#ffdad6",
                        "surface-bright": "#f7f9fb",
                        "outline-variant": "#c0c7d3",
                        "tertiary-fixed": "#78fc9c",
                        "inverse-primary": "#9ecaff",
                        "surface-container": "#eceef0",
                        "surface-tint": "#0061a3",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#00210b",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#c8ffce",
                        "on-primary-fixed-variant": "#00497c",
                        "primary-fixed-dim": "#9ecaff",
                        "on-surface-variant": "#404751",
                        "on-secondary": "#ffffff",
                        "on-background": "#191c1e",
                        "secondary-fixed": "#ffdbd0",
                        "surface-container-low": "#f2f4f6",
                        "secondary": "#ad3300",
                        "secondary-fixed-dim": "#ffb59e",
                        "secondary-container": "#ff642d",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#005894",
                        "on-primary-container": "#ffffff",
                        "on-secondary-container": "#ffffff",
                        "background": "#f8f9fa"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "unit": "8px",
                        "stage-margin": "24px",
                        "control-panel-width": "280px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-caps": ["Space Grotesk"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "data-mono": ["Space Grotesk"],
                        "display-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "label-caps": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-md": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "data-mono": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col overflow-hidden">
    <!-- TopAppBar -->
    <header class="bg-surface-bright dark:bg-surface-dim shadow-sm z-50 flex justify-between items-center w-full px-stage-margin py-unit">
        <div class="flex items-center gap-4">
            <span class="text-headline-sm font-headline-sm font-bold text-primary">PhysicsLab Pro</span>
        </div>
        <nav class="hidden md:flex gap-8">
            <a class="text-label-caps font-label-caps text-on-surface-variant hover:text-primary transition-colors duration-200" href="提出问题.html">提出问题</a>
            <a class="text-label-caps font-label-caps text-secondary border-b-4 border-secondary pb-1" href="lesson-balance.html">动手实验</a>
            <a class="text-label-caps font-label-caps text-on-surface-variant hover:text-primary transition-colors duration-200" href="记录归纳.html">记录归纳</a>
            <a class="text-label-caps font-label-caps text-on-surface-variant hover:text-primary transition-colors duration-200" href="应用验证.html">应用验证</a>
        </nav>
        <div class="flex items-center gap-4">
            <button class="material-symbols-outlined p-2 rounded-full hover:bg-surface-container">help</button>
            <button class="material-symbols-outlined p-2 rounded-full hover:bg-surface-container">settings</button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- SideNavBar -->
        <aside class="fixed left-0 top-16 h-[calc(100vh-64px)] z-40 flex flex-col bg-surface-container-highest w-control-panel-width shadow-md">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-1">
                    <span class="material-symbols-outlined text-primary text-3xl">science</span>
                    <span class="text-label-caps font-label-caps font-black">Junior Lab</span>
                </div>
                <p class="text-xs text-on-surface-variant">Level 1: Mechanics</p>
            </div>
            <nav class="flex-1 px-2 space-y-1">
                <div class="bg-primary-container text-on-primary-container rounded-xl m-2 p-3 flex items-center gap-4 cursor-pointer">
                    <span class="material-symbols-outlined">science</span>
                    <span class="text-label-caps font-label-caps">力学实验</span>
                </div>
            </nav>
            <div class="p-4 border-t border-outline-variant/30">
                <button class="w-full bg-secondary py-3 px-4 rounded-xl text-on-secondary font-bold shadow-tactile hover:brightness-110">
                    Start Experiment
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-control-panel-width mt-0 p-stage-margin flex flex-col gap-stage-margin overflow-y-auto">
            <!-- Breadcrumbs -->
            <nav class="flex items-center gap-2 text-on-surface-variant">
                <span class="text-label-caps">物理实验库</span>
                <span class="material-symbols-outlined text-sm">chevron_right</span>
                <span class="text-label-caps">力学</span>
                <span class="material-symbols-outlined text-sm">chevron_right</span>
                <span class="text-label-caps text-primary">二力平衡探究</span>
            </nav>

            <!-- Main Content Grid -->
            <div class="grid grid-cols-12 gap-gutter flex-1">
                <!-- Canvas Area -->
                <div class="col-span-12 lg:col-span-8 flex flex-col gap-gutter">
                    <div class="bg-white rounded-3xl shadow-tactile flex-1 relative stage-grid overflow-hidden border border-surface-container-highest">
                        <canvas id="forceCanvas" class="w-full h-full" style="display: block;"></canvas>
                    </div>
                </div>

                <!-- Control Panel -->
                <div class="col-span-12 lg:col-span-4 flex flex-col gap-gutter">
                    <!-- State Display -->
                    <div class="bg-white rounded-3xl shadow-tactile p-6 border border-surface-container-highest">
                        <p class="text-label-caps font-label-caps text-on-surface-variant mb-3">当前状态</p>
                        <div id="stateDisplay" class="text-headline-md font-headline-md flex items-center gap-2">
                            <span class="text-tertiary">平衡状态 ✓</span>
                        </div>
                    </div>

                    <!-- Force Controls -->
                    <div class="bg-white rounded-3xl shadow-tactile p-6 border border-surface-container-highest">
                        <p class="text-label-caps font-label-caps text-on-surface-variant mb-4">左侧力量</p>
                        <div class="space-y-3">
                            <input type="range" id="leftForce" min="0" max="12" value="5" class="w-full h-2 bg-surface-container rounded-lg appearance-none cursor-pointer">
                            <div class="flex justify-between items-center">
                                <span class="text-body-md" id="leftForceValue">5.0 N</span>
                                <select id="leftDirection" class="px-3 py-1 border border-outline rounded-lg text-body-md">
                                    <option value="right">向右</option>
                                    <option value="left">向左</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl shadow-tactile p-6 border border-surface-container-highest">
                        <p class="text-label-caps font-label-caps text-on-surface-variant mb-4">右侧力量</p>
                        <div class="space-y-3">
                            <input type="range" id="rightForce" min="0" max="12" value="5" class="w-full h-2 bg-surface-container rounded-lg appearance-none cursor-pointer">
                            <div class="flex justify-between items-center">
                                <span class="text-body-md" id="rightForceValue">5.0 N</span>
                                <select id="rightDirection" class="px-3 py-1 border border-outline rounded-lg text-body-md">
                                    <option value="right">向右</option>
                                    <option value="left">向左</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Net Force -->
                    <div class="bg-primary-container rounded-3xl p-6 text-on-primary-container">
                        <p class="text-label-caps font-label-caps mb-2">合力</p>
                        <div class="text-data-mono font-data-mono text-2xl">
                            <span id="netForce">ΣF = 0.00 N</span>
                        </div>
                    </div>

                    <!-- Record Button -->
                    <button id="recordBtn" class="w-full bg-secondary text-on-secondary py-3 px-4 rounded-xl font-bold shadow-tactile hover:brightness-110 active:scale-95">
                        <span class="material-symbols-outlined inline mr-2">done</span>记录
                    </button>
                </div>
            </div>

            <!-- Record List -->
            <div class="bg-white rounded-3xl shadow-tactile p-6 border border-surface-container-highest">
                <h3 class="text-headline-md font-headline-md mb-4">实验记录</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-body-md">
                        <thead class="border-b border-outline-variant">
                            <tr class="text-on-surface-variant text-label-caps font-label-caps">
                                <th class="text-left py-3 px-3">序号</th>
                                <th class="text-left py-3 px-3">左力</th>
                                <th class="text-left py-3 px-3">右力</th>
                                <th class="text-left py-3 px-3">合力</th>
                                <th class="text-left py-3 px-3">状态</th>
                            </tr>
                        </thead>
                        <tbody id="recordList">
                            <tr class="text-on-surface-variant text-center">
                                <td colspan="5" class="py-6">暂无记录</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex gap-gutter justify-between pb-6">
                <a href="提出问题.html" class="flex items-center gap-2 px-6 py-3 border border-outline rounded-xl text-on-surface hover:bg-surface-container transition-colors">
                    <span class="material-symbols-outlined">arrow_back</span>
                    上一步
                </a>
                <a href="记录归纳.html" class="flex items-center gap-2 px-6 py-3 bg-primary text-on-primary rounded-xl font-bold hover:brightness-110 transition-all shadow-tactile">
                    下一步
                    <span class="material-symbols-outlined">arrow_forward</span>
                </a>
            </div>
        </main>
    </div>

    <script>
        // Canvas Setup
        const canvas = document.getElementById('forceCanvas');
        const ctx = canvas.getContext('2d');
        let records = [];

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            draw();
        }

        // Physics Calculations
        function calculateNetForce() {
            const leftForce = parseFloat(document.getElementById('leftForce').value);
            const rightForce = parseFloat(document.getElementById('rightForce').value);
            const leftDir = document.getElementById('leftDirection').value;
            const rightDir = document.getElementById('rightDirection').value;

            // Rightward positive
            let f1 = leftDir === 'right' ? leftForce : -leftForce;
            let f2 = rightDir === 'right' ? rightForce : -rightForce;
            let netForce = f1 + f2;

            return { f1, f2, netForce, leftForce, rightForce, leftDir, rightDir };
        }

        function updateDisplay() {
            const { f1, f2, netForce, leftForce, rightForce, leftDir, rightDir } = calculateNetForce();
            
            // Update force displays
            document.getElementById('leftForceValue').textContent = leftForce.toFixed(1) + ' N';
            document.getElementById('rightForceValue').textContent = rightForce.toFixed(1) + ' N';
            document.getElementById('netForce').textContent = `ΣF = ${netForce.toFixed(2)} N`;

            // Update state display
            const isBalanced = Math.abs(netForce) < 0.5;
            const stateDisplay = document.getElementById('stateDisplay');
            if (isBalanced) {
                stateDisplay.className = 'text-headline-md font-headline-md flex items-center gap-2';
                stateDisplay.innerHTML = '<span class="text-tertiary">平衡状态 ✓</span>';
            } else {
                stateDisplay.className = 'text-headline-md font-headline-md flex items-center gap-2';
                stateDisplay.innerHTML = '<span class="text-error">非平衡状态</span>';
            }

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scale = 20; // pixels per Newton

            const { f1, f2 } = calculateNetForce();

            // Draw object (rectangle)
            ctx.fillStyle = '#e0e3e5';
            ctx.fillRect(centerX - 40, centerY - 20, 80, 40);
            ctx.strokeStyle = '#404751';
            ctx.lineWidth = 2;
            ctx.strokeRect(centerX - 40, centerY - 20, 80, 40);

            // Draw forces
            drawArrow(centerX - 40, centerY, f1 * scale, 0, '#005894', 'F₁'); // Left force (blue)
            drawArrow(centerX + 40, centerY, f2 * scale, 0, '#ad3300', 'F₂'); // Right force (red)
        }

        function drawArrow(fromX, fromY, distance, angle, color, label) {
            const toX = fromX + distance;
            const toY = fromY + distance * Math.sin(angle);

            // Arrow line
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            // Arrow head
            const headlen = 15;
            const angle_rad = Math.atan2(toY - fromY, toX - fromX);
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle_rad - Math.PI / 6), toY - headlen * Math.sin(angle_rad - Math.PI / 6));
            ctx.lineTo(toX - headlen * Math.cos(angle_rad + Math.PI / 6), toY - headlen * Math.sin(angle_rad + Math.PI / 6));
            ctx.closePath();
            ctx.fill();

            // Label
            ctx.fillStyle = color;
            ctx.font = 'bold 16px "Space Grotesk"';
            ctx.textAlign = 'center';
            ctx.fillText(label, fromX + distance / 2, fromY - 20);
        }

        // Event Listeners
        document.getElementById('leftForce').addEventListener('input', updateDisplay);
        document.getElementById('rightForce').addEventListener('input', updateDisplay);
        document.getElementById('leftDirection').addEventListener('change', updateDisplay);
        document.getElementById('rightDirection').addEventListener('change', updateDisplay);

        document.getElementById('recordBtn').addEventListener('click', function() {
            const { leftForce, rightForce, netForce, leftDir, rightDir } = calculateNetForce();
            const isBalanced = Math.abs(netForce) < 0.5;

            records.unshift({
                num: records.length + 1,
                left: leftForce.toFixed(1) + ' ' + (leftDir === 'right' ? '→' : '←'),
                right: rightForce.toFixed(1) + ' ' + (rightDir === 'right' ? '→' : '←'),
                net: netForce.toFixed(2),
                status: isBalanced ? '平衡' : '不平衡'
            });

            updateRecordList();
        });

        function updateRecordList() {
            const recordList = document.getElementById('recordList');
            if (records.length === 0) {
                recordList.innerHTML = '<tr class="text-on-surface-variant text-center"><td colspan="5" class="py-6">暂无记录</td></tr>';
                return;
            }

            recordList.innerHTML = records.map((r, idx) => `
                <tr class="border-b border-surface-container hover:bg-surface-container-low transition-colors">
                    <td class="py-3 px-3">${idx + 1}</td>
                    <td class="py-3 px-3">${r.left}</td>
                    <td class="py-3 px-3">${r.right}</td>
                    <td class="py-3 px-3 text-data-mono font-data-mono">${r.net} N</td>
                    <td class="py-3 px-3"><span class="px-2 py-1 rounded-lg ${r.status === '平衡' ? 'bg-tertiary-fixed text-on-tertiary-fixed' : 'bg-error-container text-on-error-container'}">${r.status}</span></td>
                </tr>
            `).join('');
        }

        // Initialize
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        updateDisplay();
    </script>
</body>
</html>
